version: '3.8'

services:
  # Database Service (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: taskflow_db
    restart: always
    environment:
      POSTGRES_DB: taskflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (Spring Boot 3.4 + Java 21)
  backend:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    container_name: taskflow_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/taskflow_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres_password_change_me
      JWT_SECRET: c2VjdXJlX2p3dF9zZWNyZXRfa2V5X2Zvcl90YXNrZmxvd19lbnRlcnByaXNlX2FwcGxpY2F0aW9uXzIwMjY=
      JWT_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 604800000
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost
    ports:
      - "8080:8080"

  # Frontend Service (Next.js 15)
  frontend:
    build:
      context: ./code/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    container_name: taskflow_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
